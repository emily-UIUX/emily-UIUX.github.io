name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/**"]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deployment structure
        run: |
          mkdir -p deploy/Claude_Test2
          cp -r out/. deploy/Claude_Test2/
          cp out/index.html deploy/Claude_Test2/404.html
          touch deploy/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          clean: true
